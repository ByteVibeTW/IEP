services:
  mysql:
    image: mysql:8.0
    container_name: iep-mysql
    environment:
      MYSQL_ROOT_PASSWORD: bigred
      MYSQL_DATABASE: iep
    ports:
      - "3306:3306"
    volumes:
      - iep-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

volumes:
  iep-mysql-data:
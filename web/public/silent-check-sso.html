<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="frame-ancestors https://iep.yang-lin.dev http://localhost:*" />
  <title>IEP Check SSO</title>
</head>

<body>
  <script>
    try {
      if (parent && parent !== window) {
        parent.postMessage(location.href, location.origin);
      }
    } catch (error) {
      console.warn('Silent SSO check failed:', error);
    }
  </script>
</body>

</html>

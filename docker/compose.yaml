services:
  mysql:
    image: mysql:8.0
    container_name: iep-mysql
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: bigred
      MYSQL_DATABASE: iep
    ports:
      - "3306:3306"
    volumes:
      - iep-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - iep-network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: iep-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - iep-network

  iep:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: iep-app
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: ${TZ}
      SPRING_DATASOURCE_URL: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DB}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Taipei&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      APP_GENERATE_URL: ${APP_GENERATE_URL}
    ports:
      - "8040:8040"
    volumes:
      - upload_data:/app/upload
    depends_on:
      teachat:
        condition: service_started
    networks:
      - iep-network

  teachat:
    build:
      context: ../teaChatBot
      dockerfile: Dockerfile
    container_name: iep-teachat
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: ${TZ}
      GOOGLE_GEMINI_API_KEY: ${GOOGLE_GEMINI_API_KEY}
      GOOGLE_SEARCH_API_KEY: ${GOOGLE_SEARCH_API_KEY}
      GOOGLE_SEARCH_ENGINE_ID: ${GOOGLE_SEARCH_ENGINE_ID}
      QDRANT_URL: ${QDRANT_URL}
      QDRANT_COLLECTION_NAME: ${QDRANT_COLLECTION_NAME}
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_USER: ${SPRING_DATASOURCE_USERNAME}
      MYSQL_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      MYSQL_DB: ${MYSQL_DB}
      GEMINI_MODEL: ${GEMINI_MODEL}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      WEB_API_URL: ${WEB_API_URL}
      WEB_API_USERNAME: ${WEB_API_USERNAME}
      WEB_API_PASSWORD: ${WEB_API_PASSWORD}
      WEB_API_TOKEN: ${WEB_API_TOKEN}
      THINKING_BUDGET: ${THINKING_BUDGET}
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_started
    networks:
      - iep-network

volumes:
  upload_data:
  iep-mysql-data:
  qdrant-data:

networks:
  iep-network:
    external: true
